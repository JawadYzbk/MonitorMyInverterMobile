name: wattwise
description: WattWise — live inverter, battery, solar and grid power for Android and iPhone.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: any
  shared_preferences: any
  flutter_secure_storage: any
  fl_chart: any
  flutter_local_notifications: any
  flutter_foreground_task: any
  flutter_tts: any
  home_widget: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# App icon (CI runs `dart run flutter_launcher_icons`; artwork from tool/make_icon.py).
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  ios: true
  remove_alpha_ios: true
